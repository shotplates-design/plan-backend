[project]
name = "plan-backend"
version = "0.1.0"
description = "Plan — NFL-first sports betting backend (play money MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "stripe>=12,<14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RUF"]
ignore = ["B008", "N815"]  # B008: FastAPI Depends(); N815: camelCase for frontend contract

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "RUF012", "E501"]
"app/odds_provider/mock.py" = ["E501"]
"app/odds_provider/sample_props.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
