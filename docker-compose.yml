# Optional local Postgres. Docker is not required — the README also covers a host Postgres
# install and a SQLite fallback.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plan
      POSTGRES_PASSWORD: plan
      POSTGRES_DB: plan
    ports:
      - "5432:5432"
    volumes:
      - plan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plan -d plan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plan_pg:
